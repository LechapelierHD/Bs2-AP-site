<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS2 AP — Setup</title>
    <meta name="description" content="BioShock 2 Remastered Archipelago client — download, install, and join the community.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #e6f4f4;
            --ink-soft: #8fadb0;
            --foam: #e6f4f4;
            --sea: #3ec7c9;
            --sea-deep: #2aa8ab;
            --matrix: #3ec7c9;
            --matrix-dim: #1f7f82;
            --line: rgba(62, 199, 201, 0.28);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "DM Sans", sans-serif;
            background: #0b1218;
            line-height: 1.5;
        }

        a { color: inherit; }

        .site-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(10px);
            background: rgba(11, 18, 24, 0.92);
            border-bottom: 1px solid var(--line);
        }

        .site-nav-inner {
            width: min(1000px, calc(100% - 2.5rem));
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
        }

        .brand-link {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-right: auto;
            text-decoration: none;
            font-family: "Unbounded", sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--sea-deep);
        }

        .brand-link img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            display: block;
            border-radius: 6px;
        }

        .lang-tabs { display: inline-flex; gap: 0.15rem; }
        .lang-tabs button {
            font-family: "Unbounded", sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            background: transparent;
            color: var(--ink-soft);
            padding: 0.55rem 0.7rem;
            border-bottom: 2px solid transparent;
            cursor: pointer;
        }
        .lang-tabs button.active {
            color: var(--sea-deep);
            border-bottom-color: var(--matrix-dim);
        }
        .lang-tabs button:not(.active):hover { color: var(--sea-deep); }

        .hero {
            position: relative;
            min-height: calc(100svh - 58px);
            display: grid;
            place-items: center;
            overflow: hidden;
            color: var(--foam);
            text-align: center;
            isolation: isolate;
        }

        .hero-visual {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse 55% 45% at 50% 38%, rgba(62, 199, 201, 0.18), transparent 62%),
                radial-gradient(ellipse 40% 30% at 18% 74%, rgba(18, 70, 78, 0.35), transparent 58%),
                linear-gradient(165deg, #070d12 0%, #0b1218 42%, #102028 100%);
        }

        .mw-sky {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 18%, rgba(230, 244, 244, 0.45), transparent),
                radial-gradient(1.5px 1.5px at 28% 42%, rgba(62, 199, 201, 0.55), transparent),
                radial-gradient(1px 1px at 63% 28%, rgba(62, 199, 201, 0.35), transparent),
                radial-gradient(1px 1px at 78% 55%, rgba(230, 244, 244, 0.28), transparent),
                radial-gradient(1.5px 1.5px at 88% 16%, rgba(62, 199, 201, 0.4), transparent);
            opacity: 0.85;
            animation: star-twinkle 6s ease-in-out infinite alternate;
        }

        .mw-map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.85;
        }

        .mw-links path { animation: link-flow 8s linear infinite; }
        .mw-links path:nth-child(2) { animation-duration: 11s; animation-direction: reverse; }
        .mw-links path:nth-child(3) { animation-duration: 9s; }

        .mw-portals circle {
            transform-origin: center;
            transform-box: fill-box;
            animation: portal-pulse 5s var(--ease) infinite;
        }
        .mw-portals circle:nth-child(2) { animation-delay: 0.6s; }
        .mw-portals circle:nth-child(3) { animation-delay: 1.2s; }
        .mw-portals circle:nth-child(4) { animation-delay: 1.8s; }

        .mw-nodes circle { animation: node-glow 3.2s ease-in-out infinite alternate; }
        .mw-nodes circle:nth-child(odd) { animation-delay: 0.8s; }

        .mw-islands ellipse {
            transform-origin: center;
            transform-box: fill-box;
            animation: island-drift 14s var(--ease) infinite alternate;
        }
        .mw-islands ellipse:nth-child(2) { animation-duration: 18s; animation-delay: 1s; }
        .mw-islands ellipse:nth-child(3) { animation-duration: 16s; animation-delay: 2s; }
        .mw-islands ellipse:nth-child(4) { animation-duration: 20s; animation-delay: 0.5s; }

        .hero-logo { animation: logo-float 5.5s var(--ease) infinite; }

        @keyframes logo-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes link-flow { to { stroke-dashoffset: -120; } }
        @keyframes portal-pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.55; }
        }
        @keyframes node-glow {
            from { opacity: 0.45; }
            to { opacity: 1; }
        }
        @keyframes island-drift {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        @keyframes star-twinkle {
            from { opacity: 0.55; }
            to { opacity: 0.95; }
        }

        .hero-content {
            width: min(920px, calc(100% - 2.5rem));
            padding: clamp(2.5rem, 7vh, 4.5rem) 0 clamp(3.5rem, 10vh, 6rem);
        }

        .hero-logo {
            display: block;
            width: min(220px, 54vw);
            height: auto;
            margin: 0 auto 1.1rem;
            filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.45));
            border-radius: 24px;
        }

        .hero-logo-missing { display: none; color: #f0b4b4; margin: 0 0 1rem; }

        .brand {
            margin: 0 0 0.85rem;
            font-family: "Unbounded", sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 6.5vw, 3.8rem);
            line-height: 0.95;
            letter-spacing: -0.03em;
        }

        .brand span {
            display: block;
            margin-top: 0.45rem;
            font-weight: 500;
            font-size: 0.36em;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--matrix);
        }

        .tagline {
            margin: 0 auto 1.1rem;
            max-width: 40ch;
            font-size: 1.05rem;
            color: rgba(230, 244, 244, 0.78);
        }

        .visitors { display: flex; justify-content: center; margin: 0 0 1.35rem; }
        .visitors img { height: 20px; width: auto; }

        .cta { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.75rem; }
        .cta a, a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            min-height: 2.85rem;
            padding: 0.7rem 1.15rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.25s var(--ease), background 0.25s ease, border-color 0.25s ease;
        }
        .cta a:hover, a.btn:hover { transform: translateY(-2px); }

        .cta .community, a.btn.community {
            border: 1px solid rgba(127, 231, 228, 0.4);
            background: rgba(10, 22, 28, 0.72);
            color: #e8fffb;
        }
        .cta .community:hover, a.btn.community:hover {
            background: rgba(18, 56, 64, 0.9);
            border-color: rgba(127, 231, 228, 0.75);
        }

        a.btn.primary {
            background: var(--matrix);
            color: #071216;
            border: none;
        }
        a.btn.primary:hover { background: #63dbdd; }
        a.btn.ghost {
            border: 1px solid rgba(62, 199, 201, 0.45);
            background: transparent;
            color: var(--foam);
        }
        a.btn.ghost:hover { border-color: var(--matrix-dim); }
        a.btn.disabled { pointer-events: none; opacity: 0.45; transform: none; }

        .discord-icon {
            width: 18px;
            height: 18px;
            object-fit: cover;
            border-radius: 3px;
        }

        main {
            width: min(860px, calc(100% - 2.5rem));
            margin: 0 auto;
            padding: clamp(2.5rem, 6vw, 4rem) 0 3rem;
        }

        section { margin: 0 0 1rem; }
        section h2 {
            margin: 1.75rem 0 0.7rem;
            font-family: "Unbounded", sans-serif;
            font-weight: 700;
            font-size: clamp(1.15rem, 2.4vw, 1.4rem);
            letter-spacing: -0.02em;
            color: var(--sea-deep);
        }

        .card {
            background: #121a22;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 1.15rem 1.25rem;
        }

        .card p { margin: 0; color: var(--ink); }
        .card .hint { margin-top: 0.45rem; color: var(--ink-soft); font-size: 0.95rem; }
        .card code { color: var(--sea); font-size: 0.92em; }

        .row-card {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .row-card .info { flex: 1; min-width: 220px; }
        .row-card strong {
            display: block;
            font-family: "Unbounded", sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            margin-bottom: 0.25rem;
            color: var(--sea-deep);
        }

        .meta {
            margin-top: 2.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--line);
            color: var(--ink-soft);
            font-size: 0.88rem;
        }
        .meta code { color: var(--sea); }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(120%);
            background: var(--sea-deep);
            color: var(--foam);
            padding: 12px 18px;
            border-radius: 4px;
            opacity: 0;
            transition: transform 0.35s ease, opacity 0.35s ease;
            z-index: 30;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>

            install_hint: "The client copies dinput8.dll into Build\\Final. Relaunch the game after install.",
            h_play: "2. Checks, chapters, goal",
            play_p: "<strong>Check</strong>: walk up to an AP pickup and press <strong>Use (F/E)</strong> — the location is sent to the server.<br><strong>Chapters</strong>: unlocked with tickets (Adonis → … → Inner Persephone; optional Minerva).<br><strong>Goal</strong>: receive <strong>Escape Rapture</strong> (placed in Inner Persephone).",
            play_hint: "The client radar only shows still-open AP checks.",
            h_connect: "3. Connect",
            connect_p: "Generate the multiworld with Archipelago (game <strong>BioShock 2 Remastered</strong>). In the client: address, slot name, password → <strong>Connect</strong>.",
            connect_hint: "Example: <code>archipelago.gg:38281</code>. Launch the game so the Bs2Live bridge answers.",
            h_discord: "Community",
            discord_title: "Synthorium",
            discord_desc: "Announcements, help, bugs, and multiworld — everything happens in the community.",
            discord_hint: "DMs are limited: use the server to talk.",
            btn_discord: "Join the community",
            h_bug: "4. Bug or problem?",
            bug_intro: "If you hit a bug, crash, or other issue, post in the <strong>community</strong> with a clear description (what you did + what happened).",
            bug_hint: "If possible, attach client logs and say whether grant / Use check / radar is involved. Server: <a href=\"https://lechapelierhd.github.io/synthetic-shores/\" target=\"_blank\" rel=\"noopener noreferrer\">Synthetic Shores</a>.",
            meta: "Client folder: <code>BioShock 2 AP</code> · AP game: <code>BioShock 2 Remastered</code> · version <code>1.0.0</code>",
        },
    };

    function t(key) {
        return (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
    }

    function applyLang() {
        document.documentElement.lang = lang;
        document.title = t("title");
        document.querySelectorAll("[data-i18n]").forEach((el) => {
            el.textContent = t(el.getAttribute("data-i18n"));
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
            el.innerHTML = t(el.getAttribute("data-i18n-html"));
        });
        document.querySelectorAll(".lang-tabs button").forEach((btn) => {
            const active = btn.getAttribute("data-lang") === lang;
            btn.classList.toggle("active", active);
            btn.setAttribute("aria-selected", active ? "true" : "false");
        });
        syncClientDownload();
        syncApworldDownload();
        syncPatchDownload();
        ["discordBtn", "discordTopBtn"].forEach((id) => {
            const a = $(id);
            if (a) a.href = DISCORD_URL;
        });
        localStorage.setItem("bs2ap_lang", lang);
    }

    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function syncDownload(btnId, hintId, url, version, pasteKey, readyKey) {
        const btn = $(btnId);
        const hint = $(hintId);
        if (!btn || !hint) return;
        const cleanUrl = (url || "").trim();
        const cleanVersion = (version || "").trim();
        const valid = /^https?:\/\//i.test(cleanUrl);
        btn.href = valid ? cleanUrl : "#";
        btn.classList.toggle("disabled", !valid);
        if (!valid) hint.textContent = t(pasteKey);
        else if (cleanVersion) hint.textContent = t("hint_version").replace("{v}", cleanVersion);
        else hint.textContent = t(readyKey);
    }

    function syncClientDownload() {
        syncDownload("clientDownloadBtn", "clientVersionHint", CLIENT_DOWNLOAD_URL, CLIENT_VERSION, "hint_paste", "hint_ready");
    }

    function syncApworldDownload() {
        syncDownload("apworldDownloadBtn", "apworldVersionHint", APWORLD_DOWNLOAD_URL, APWORLD_VERSION, "hint_apworld_paste", "hint_apworld_ready");
    }

    function syncPatchDownload() {
        syncDownload("patchDownloadBtn", "patchVersionHint", PATCH_DOWNLOAD_URL, PATCH_VERSION, "hint_patch_paste", "hint_patch_ready");
    }

    document.querySelectorAll(".lang-tabs button").forEach((btn) => {
        btn.addEventListener("click", () => {
            lang = btn.getAttribute("data-lang");
            applyLang();
        });
    });

    applyLang();
    void toast;
})();
</script>
</body>
</html>
